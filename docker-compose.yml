
services:
  postgres:
    image: postgres:17
    container_name: api-governance-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance_dev_2026
      POSTGRES_DB: api_governance

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U governance -d api_governance
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
