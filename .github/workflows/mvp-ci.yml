name: Backend MVP checks

on:
  pull_request:
    branches: [develope]
  workflow_dispatch:

jobs:
  build-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_governance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_governance_test?schema=public
      AUTH_JWT_SECRET: CI-only-test-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - name: Integration tests on isolated PostgreSQL
        run: |
          printf 'DATABASE_URL=%s\nAUTH_JWT_SECRET=%s\nNODE_ENV=test\nFRONTEND_URL=%s\n' \
            "$DATABASE_URL" "$AUTH_JWT_SECRET" "$FRONTEND_URL" > .env.test
          npm run test:integration
